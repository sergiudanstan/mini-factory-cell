name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; no job here needs to write anything.
permissions:
  contents: read

jobs:
  test:
    name: build, logic tests and page smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install dependencies from the lockfile
        run: npm ci --ignore-scripts
      - name: Rebuild index.html from src/
        run: npm run build
      - name: Fail if the committed index.html is not what the build produces
        run: git diff --exit-code -- index.html
      - name: Logic tests (node, no browser)
        run: npm test
      - name: Perturbation check (the logic tests must catch deliberate breakage)
        # With the dial interlock weakened the run must FAIL (exit 1, not a crash).
        run: |
          set +e
          npm run perturb | tee perturb.log
          code=${PIPESTATUS[0]}
          set -e
          grep -q PERTURBED perturb.log
          [ "$code" -eq 1 ] || { echo "expected the perturbed run to fail with exit 1, got $code" >&2; exit 1; }
      - name: Syntax-check the Blender and CAD helper scripts
        # They need Blender / a STEP kernel, which CI does not have: this only proves they parse.
        run: python3 -m py_compile blender/*.py tools/cad/step2glb.py
      - name: Load index.html in headless Chrome, fail on any page error
        # Chrome is preinstalled on the runner image; playwright-core drives it,
        # so no browser download is needed.
        run: npm run smoke

  audit:
    name: security audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install audit tooling (hash-pinned)
        run: python -m pip install --require-hashes -r .github/requirements-ci.lock
      - name: Known vulnerabilities in the CI toolchain
        run: pip-audit --strict --no-deps -r .github/requirements-ci.lock --progress-spinner off
      - name: Known vulnerabilities in npm dependencies
        run: npm audit --audit-level=low
      - name: Audit the workflows themselves
        run: zizmor --format plain .github/workflows/
